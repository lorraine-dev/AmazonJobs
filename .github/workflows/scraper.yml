name: Amazon Jobs Scraper

on:
  schedule:
    # Run every 5 days at 08:00 UTC
    - cron: '0 8 */5 * *'
  workflow_dispatch:
    inputs:
      amazon_engine:
        description: 'Amazon engine (api|selenium)'
        required: false
        default: 'api'

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Use workflow input when manually dispatched; default to 'api' on schedule runs
  AMAZON_ENGINE: ${{ github.event_name == 'workflow_dispatch' && inputs.amazon_engine || 'api' }}
  # Opt into Node.js 24 now for JavaScript actions.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          constraints.txt
          constraints-selenium.txt

    - name: Install Chrome
      if: ${{ env.AMAZON_ENGINE == 'selenium' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Install dependencies
      env:
        PIP_DISABLE_PIP_VERSION_CHECK: '1'
      run: |
        python -m pip install -U pip setuptools wheel
        if [ "$AMAZON_ENGINE" = "selenium" ]; then
          echo "Installing runtime with Selenium constraints..."
          python -m pip install -r requirements.txt -c constraints-selenium.txt
          echo "Installing selenium optional dependencies..."
          python -m pip install '.[selenium]' -c constraints-selenium.txt
        else
          echo "Installing runtime with API constraints..."
          python -m pip install -r requirements.txt -c constraints.txt
        fi

    - name: Download previous data
      uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
      with:
        name: job-data
        path: data/raw/
        workflow: scraper.yml
        workflow_conclusion: success
        if_no_artifact_found: ignore
      continue-on-error: true

    - name: Download previous state
      uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
      with:
        name: job-state
        path: .
        workflow: scraper.yml
        workflow_conclusion: success
        if_no_artifact_found: ignore
      continue-on-error: true

    - name: Debug downloaded files
      run: |
        echo "=== Checking downloaded files ==="
        ls -la data/raw/ || echo "data/raw/ directory not found"
        find . -name "*.csv" -type f || echo "No CSV files found"

    - name: Check TheirStack secret presence
      env:
        THEIR_STACK_API_KEY: ${{ secrets.THEIR_STACK_API_KEY }}
      run: |
        if [ -z "${THEIR_STACK_API_KEY}" ]; then
          echo "❌ THEIR_STACK_API_KEY is not set"; exit 1
        else
          echo "✅ TheirStack key detected (masked)"
        fi

    - name: Run scraper with timeout
      id: scraper
      env:
        THEIR_STACK_API_KEY: ${{ secrets.THEIR_STACK_API_KEY }}
      run: |
        timeout 1800 python src/scripts/run_scraper.py --amazon-engine "$AMAZON_ENGINE"  # 30 minute timeout
      continue-on-error: true

    - name: Print scraper log tail
      if: always()
      run: |
        echo "=== Tail logs/scraper.log (if present) ==="
        if [ -f logs/scraper.log ]; then
          tail -n 200 logs/scraper.log || true
        else
          echo "logs/scraper.log not found"
        fi

    - name: Check scraper success
      run: |
        if [ "${{ steps.scraper.outcome }}" == "success" ]; then
          echo "✅ Scraper completed successfully"
        else
          echo "❌ Scraper failed or timed out"
          exit 1
        fi

    - name: Extract and canonicalize skills
      run: |
        python -m src.scripts.extract_skills --aliases config/skill_aliases.yaml --output-dir data/processed

    - name: Generate fuzzy merge candidates (strict)
      run: |
        python -m src.scripts.generate_fuzzy_merges \
          --strict-skill-like \
          --block-mode first_sig \
          --threshold 85 \
          --prune-jd-stopwords \
          --skip-both-long \
          --topk-per-variant 1 \
          --anchor-to-alias \
          --restrict-known-canonicals \
          --input-raw-csv data/processed/skills_raw_freq.csv \
          --aliases config/skill_aliases.yaml \
          --output data/processed/skills_fuzzy_candidates.csv

    - name: Generate skills map JSON
      run: |
        python -m src.scripts.generate_skills_map \
          --aliases config/skill_aliases.yaml \
          --fuzzy-candidates data/processed/skills_fuzzy_candidates.csv \
          --min-score 100 \
          --output-config-json config/skills_map.json \
          --output-docs-json docs/skills_map.json

    - name: Upload job data
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: job-data
        path: data/raw/
        retention-days: 30

    - name: Upload scraper logs
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: logs
        path: logs/
        retention-days: 14
        if-no-files-found: ignore

    - name: Upload scraper state
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: job-state
        path: theirstack_state.json
        retention-days: 30
        if-no-files-found: ignore

    - name: Upload backups (optional)
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: job-backups
        path: data/backups/
        retention-days: 7
        if-no-files-found: ignore

    - name: Generate dashboard
      run: |
        python -m src.utils.data_processor

    - name: Setup Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

    - name: Upload artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
      with:
        path: ./docs

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

    - name: Notify on success
      if: success()
      run: |
        echo "✅ Amazon Jobs Scraper completed successfully"
        echo "📊 Dashboard deployed to: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
        echo "📅 Run completed at: $(date)"

    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Amazon Jobs Scraper failed"
        echo "📅 Failure occurred at: $(date)"
        echo "🔍 Check the logs above for details"
